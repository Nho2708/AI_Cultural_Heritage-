name: CI

# Nhánh việc chỉ chạy CI qua Pull Request (mở ở dạng nháp nếu chưa xong): chạy thêm lượt push cho cùng commit thì
# hai lượt cùng tên kiểm tra, một lượt hỏng ngẫu nhiên cũng chặn gộp.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Đẩy mới lên cùng nhánh thì hủy lượt chạy cũ.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kiểm mã, chạy test và rà lỗ hổng gói phụ thuộc. Test không gọi mô hình thật nên không cần khóa nào.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Chỉ cài gói chạy (như máy demo) rồi nạp ứng dụng: bắt gói bị thiếu trong requirements.txt mà test vẫn có nhờ gói dev.
      - name: Nạp ứng dụng chỉ với gói chạy
        run: |
          pip install -r requirements.txt
          python -c "import app.asgi"
        env:
          AI_INTERNAL_KEY: kiem-nap-ung-dung
      - name: Cài gói
        run: pip install -r requirements-dev.txt
      - name: Kiểm mã bằng ruff
        run: ruff check .
      - name: Chạy test và đo độ phủ
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=40
      - name: Rà lỗ hổng gói phụ thuộc
        run: pip-audit -r requirements.txt

  # Dựng ảnh Docker cho máy chủ Google Cloud rồi chạy thử: nghe ở 0.0.0.0 trong container, /health trả 200, chạy bằng người dùng
  # không phải root, API khác /health vẫn đòi khóa nội bộ.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Dựng ảnh
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dsvhvn-ci/ai:ci
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai
      - name: Chạy thử container
        run: |
          set -euo pipefail
          docker run -d --name ai -p 127.0.0.1:8090:8000 -e AI_INTERNAL_KEY=kiem-anh -e AI_PROVIDER=gemini dsvhvn-ci/ai:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/health && break; sleep 1; done
          echo
          curl -fsS -o /dev/null http://127.0.0.1:8090/health
          test "$(docker inspect -f '{{.Config.User}}' ai)" = dichvuai
          ma=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/v1/rank-related -H 'Content-Type: application/json' -d '{}')
          echo "Gọi API không có khóa nội bộ: $ma"
          test "$ma" = 401
      - name: Nhật ký container khi hỏng
        if: failure()
        run: docker logs ai

  # Quét ký hiệu làm việc nội bộ trong mã, commit message và tên nhánh (cần toàn bộ lịch sử).
  ky-hieu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Quét ký hiệu viết tắt nội bộ
        run: python .github/scripts/kiem-ky-hieu.py --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
