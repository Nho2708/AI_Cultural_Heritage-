name: CD

# Triển khai Dịch vụ AI: CI trên main đạt thì cập nhật môi trường demo (commit hỏng CI không được triển khai,
# kể cả khi chủ repo đẩy thẳng hoặc gộp vượt bảo vệ), gắn tag v* thì cập nhật bản phát hành (chủ repo duyệt) và tạo GitHub Release.
# Hai nơi chạy: máy demo QUANG-NHO (runner tự host, tắt bằng biến repo MAY_DEMO_DEPLOY=false) và máy chủ Google Cloud
# (bật bằng biến repo GCP_DEPLOY=true; ảnh Docker đẩy lên Artifact Registry, triển khai qua SSH đi qua IAP bằng script
# /opt/dsvhvn/bin/trien-khai.sh của repo backend, đăng nhập Google Cloud bằng Workload Identity Federation).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ma_commit:
        description: Commit cần triển khai (bỏ trống thì lấy commit mới nhất của nhánh đã chọn)
        required: false
        default: ''
      noi_trien_khai:
        description: Nơi triển khai
        type: choice
        options: [ca-hai, may-demo, google-cloud]
        default: ca-hai

permissions:
  contents: read

concurrency:
  group: trien-khai-ai
  cancel-in-progress: false

jobs:
  dong-goi:
    name: Đóng gói
    # Sau CI: chỉ khi CI đạt trên commit của main trong chính repo này (không nhận lượt CI của Pull Request).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MA_COMMIT: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Lấy đúng commit CI vừa kiểm (main có thể đã có commit mới hơn).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}

      # Gói chỉ gồm mã chạy, danh sách gói và web.config của IIS; máy demo tự dựng .venv khi requirements.txt đổi.
      - name: Gom tệp chạy
        run: |
          set -euo pipefail
          mkdir -p goi
          cp -r app goi/app
          find goi/app -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp requirements.txt goi/
          cp scripts/trien-khai/web.config goi/
          {
            echo "sha=${MA_COMMIT}"
            echo "ref=${GITHUB_REF}"
            echo "thoi-diem=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > goi/phien-ban.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ban-ai
          path: goi
          if-no-files-found: error
          retention-days: 30

  trien-khai:
    name: Triển khai lên máy demo
    needs: dong-goi
    if: vars.MAY_DEMO_DEPLOY != 'false' && inputs.noi_trien_khai != 'google-cloud'
    runs-on: [self-hosted, windows, may-demo]
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'phat-hanh' || 'demo' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: scripts/trien-khai

      - uses: actions/download-artifact@v8
        with:
          name: ban-ai
          path: ${{ runner.temp }}/goi

      - name: Chạy script triển khai
        shell: pwsh
        run: ./scripts/trien-khai/trien-khai-ai.ps1 -ThuMucGoi "${{ runner.temp }}/goi"

  anh-google-cloud:
    name: Dựng ảnh cho Google Cloud
    if: >-
      vars.GCP_DEPLOY == 'true' && inputs.noi_trien_khai != 'may-demo' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MA_COMMIT: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}
      GCP_REGISTRY: ${{ vars.GCP_REGISTRY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Đăng nhập Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGISTRY%%/*}" --quiet

      - uses: docker/setup-buildx-action@v4

      # Ảnh gắn mã commit; máy chủ ghi mã ảnh đang chạy để trả bản trước khi lần sau hỏng.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGISTRY }}/ai:${{ env.MA_COMMIT }}
          labels: org.opencontainers.image.revision=${{ env.MA_COMMIT }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  trien-khai-google-cloud:
    name: Triển khai lên Google Cloud
    needs: anh-google-cloud
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'phat-hanh' || 'google-cloud' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      MA_COMMIT: ${{ inputs.ma_commit || github.event.workflow_run.head_sha || github.sha }}
      GCP_VM: ${{ vars.GCP_VM }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT }}

      # Kéo ảnh, chạy bản mới, kiểm /health, hỏng thì tự trả bản trước. Khóa SSH sinh cho lượt chạy này, hết hạn sau 30 phút.
      - name: Triển khai qua SSH
        run: >
          gcloud compute ssh "$GCP_VM" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          --ssh-key-expire-after=30m --strict-host-key-checking=no
          --command "sudo /opt/dsvhvn/bin/trien-khai.sh ai ${MA_COMMIT}"

  phat-hanh:
    name: Tạo bản phát hành
    needs: [dong-goi, trien-khai]
    # Máy demo tắt (MAY_DEMO_DEPLOY=false) thì vẫn phát hành từ gói đã đóng.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.dong-goi.result == 'success' && needs.trien-khai.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ban-ai
          path: goi

      - name: Nén gói và tạo GitHub Release
        run: |
          set -euo pipefail
          zip_file="dsvhvn-ai-${TAG}.zip"
          (cd goi && zip -qr "../${zip_file}" .)
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${zip_file}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" "${zip_file}" \
              --generate-notes --verify-tag --title "${TAG}" --repo "${GITHUB_REPOSITORY}"
          fi
