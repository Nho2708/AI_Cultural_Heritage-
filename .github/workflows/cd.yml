name: CD

# Triển khai Dịch vụ AI lên máy demo: gộp vào main thì cập nhật môi trường demo,
# gắn tag v* thì cập nhật bản phát hành (chủ repo duyệt) và tạo GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trien-khai-ai
  cancel-in-progress: false

jobs:
  dong-goi:
    name: Đóng gói
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Gói chỉ gồm mã chạy, danh sách gói và web.config của IIS; máy demo tự dựng .venv khi requirements.txt đổi.
      - name: Gom tệp chạy
        run: |
          set -euo pipefail
          mkdir -p goi
          cp -r app goi/app
          find goi/app -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp requirements.txt goi/
          cp scripts/trien-khai/web.config goi/
          {
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "thoi-diem=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > goi/phien-ban.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ban-ai
          path: goi
          if-no-files-found: error
          retention-days: 30

  trien-khai:
    name: Triển khai lên máy demo
    needs: dong-goi
    runs-on: [self-hosted, windows, may-demo]
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'phat-hanh' || 'demo' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/trien-khai

      - uses: actions/download-artifact@v8
        with:
          name: ban-ai
          path: ${{ runner.temp }}/goi

      - name: Chạy script triển khai
        shell: pwsh
        run: ./scripts/trien-khai/trien-khai-ai.ps1 -ThuMucGoi "${{ runner.temp }}/goi"

  phat-hanh:
    name: Tạo bản phát hành
    if: startsWith(github.ref, 'refs/tags/v')
    needs: trien-khai
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ban-ai
          path: goi

      - name: Nén gói và tạo GitHub Release
        run: |
          set -euo pipefail
          zip_file="dsvhvn-ai-${TAG}.zip"
          (cd goi && zip -qr "../${zip_file}" .)
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${zip_file}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" "${zip_file}" \
              --generate-notes --verify-tag --title "${TAG}" --repo "${GITHUB_REPOSITORY}"
          fi
